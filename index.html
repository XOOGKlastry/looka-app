<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>looka — popatrz na działkę z góry zanim kupisz</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* === BRAND === */
      --brand: #1F8EFE;
      --brand-dark: #0E72D9;
      --brand-light: #E8F2FE;
      --brand-tint: #F4F8FE;

      /* === SURFACES === */
      --bg: #FFFFFF;
      --surface: #F7F8FA;
      --surface-2: #F0F2F5;
      --border: #E5E7EB;
      --border-strong: #D1D5DB;

      /* === TEXT === */
      --text: #0F172A;
      --text-muted: #64748B;
      --text-subtle: #94A3B8;

      /* === SEMANTIC === */
      --parcel: #10B981;
      --parcel-light: #D1FAE5;
      --warning: #F59E0B;
      --warning-light: #FEF3C7;
      --danger: #EF4444;
      --success: #10B981;

      /* === SHADOW === */
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.08), 0 4px 8px rgba(15, 23, 42, 0.04);
      --shadow-brand: 0 6px 20px rgba(31, 142, 254, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--brand);
      color: white;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-feature-settings: 'tnum';
    }

    /* === FOCUS === */
    button:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
      border-radius: 6px;
    }

    /* ================== HEADER ================== */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }

    .logo-mark {
      position: relative;
      width: 30px;
      height: 36px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .logo-pin {
      width: 30px;
      height: 30px;
      background: var(--brand);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(31, 142, 254, 0.35);
      position: relative;
    }

    .logo-pin::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 12px;
      background: white;
      border-radius: 100% 100% 100% 100% / 60% 60% 40% 40%;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .logo-pin::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: var(--brand);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      box-shadow: 0 0 0 2px white;
    }

    .logo-wordmark {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1;
    }

    .logo-wordmark .dot {
      color: var(--brand);
    }

    .logo-wordmark .ext {
      font-weight: 500;
      color: var(--text-subtle);
    }

    .header-divider {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 4px;
    }

    .header-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--brand-light);
      color: var(--brand-dark);
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.005em;
    }

    .header-pill-dot {
      width: 6px;
      height: 6px;
      background: var(--brand);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(31, 142, 254, 0.2);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .header-link:hover {
      color: var(--text);
      background: var(--surface);
    }

    .header-link svg {
      width: 14px;
      height: 14px;
    }

    .cart-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cart-btn:hover:not(:disabled) {
      border-color: var(--brand);
      background: var(--brand-tint);
      color: var(--brand-dark);
    }

    .cart-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .cart-btn svg {
      width: 14px;
      height: 14px;
    }

    .cart-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      background: var(--brand);
      color: white;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      border-radius: 100px;
    }

    /* ================== MAP ================== */
    #map {
      position: fixed;
      top: 60px;
      left: 0;
      right: 460px;
      bottom: 0;
      background: #EAEEF2;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #map.no-sidebar {
      right: 0;
    }

    .leaflet-container {
      background: #EAEEF2;
      cursor: crosshair;
      font-family: 'Inter', sans-serif;
    }

    .leaflet-container.loading {
      cursor: progress;
    }

    .leaflet-control-attribution {
      background: rgba(255, 255, 255, 0.85) !important;
      font-size: 10px !important;
      color: var(--text-subtle) !important;
      padding: 3px 8px !important;
      border-radius: 6px !important;
      margin: 8px !important;
      border: 1px solid var(--border) !important;
    }

    .leaflet-control-zoom {
      border: 1px solid var(--border) !important;
      box-shadow: var(--shadow) !important;
      border-radius: 10px !important;
      overflow: hidden;
      margin: 16px !important;
    }

    .leaflet-control-zoom a {
      background: white !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
      width: 34px !important;
      height: 34px !important;
      line-height: 34px !important;
      font-size: 17px !important;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
    }

    .leaflet-control-zoom a:hover {
      background: var(--brand-tint) !important;
      color: var(--brand-dark) !important;
    }

    /* ================== HINT BANNER ================== */
    .hint {
      position: absolute;
      top: 80px;
      left: calc(50% - 230px);
      transform: translateX(-50%);
      z-index: 500;
      background: white;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
      animation: fadeInDown 0.5s ease-out 0.3s both;
    }

    .hint-icon {
      width: 22px;
      height: 22px;
      background: var(--brand-light);
      color: var(--brand);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hint-icon svg {
      width: 12px;
      height: 12px;
    }

    .hint.hidden {
      display: none;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translate(-50%, -8px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ================== STATUS TOAST ================== */
    .status-toast {
      position: absolute;
      top: 80px;
      left: calc(50% - 230px);
      transform: translateX(-50%);
      z-index: 600;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-lg);
      animation: fadeInDown 0.3s ease-out;
      max-width: 480px;
    }

    .status-toast.error {
      border-color: rgba(245, 158, 11, 0.4);
    }

    .status-toast.success {
      border-color: rgba(16, 185, 129, 0.4);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(31, 142, 254, 0.2);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast-icon-warn,
    .toast-icon-success {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .toast-icon-warn {
      background: var(--warning-light);
      color: var(--warning);
    }

    .toast-icon-success {
      background: var(--parcel-light);
      color: var(--success);
    }

    .toast-icon-warn svg,
    .toast-icon-success svg {
      width: 12px;
      height: 12px;
    }

    .status-toast .msg-title {
      font-weight: 600;
      font-size: 13px;
    }

    .status-toast .msg-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .status-toast .close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-subtle);
      padding: 4px;
      font-size: 18px;
      line-height: 1;
      border-radius: 4px;
    }

    .status-toast .close-btn:hover {
      color: var(--text);
      background: var(--surface);
    }

    /* ================== SIDEBAR ================== */
    #sidebar {
      position: fixed;
      top: 60px;
      right: 0;
      bottom: 0;
      width: 460px;
      z-index: 500;
      background: white;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #sidebar.visible {
      transform: translateX(0);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
    }

    /* === Onboarding (welcome) === */
    .welcome {
      padding: 48px 32px;
      text-align: center;
      animation: slideUp 0.5s ease-out;
    }

    .welcome-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: var(--brand-light);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand);
    }

    .welcome-icon svg {
      width: 32px;
      height: 32px;
      stroke-width: 1.75;
    }

    .welcome-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .welcome-text {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-muted);
      margin-bottom: 24px;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }

    .welcome-steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      background: var(--surface);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .welcome-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .welcome-step strong {
      color: var(--text);
      font-weight: 600;
    }

    .welcome-step-num {
      width: 18px;
      height: 18px;
      background: white;
      border: 1px solid var(--border);
      color: var(--brand);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
      font-family: 'JetBrains Mono', monospace;
    }

    .welcome-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: white;
      color: var(--brand);
      border: 1px solid var(--brand);
      border-radius: 9px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .welcome-cta:hover {
      background: var(--brand);
      color: white;
    }

    .welcome-cta svg {
      width: 14px;
      height: 14px;
    }

    /* === Parcel header === */
    .parcel-header {
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--border);
      animation: slideUp 0.4s ease-out;
    }

    .parcel-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 8px;
    }

    .panel-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.005em;
      background: var(--parcel-light);
      color: var(--success);
      padding: 4px 10px;
      border-radius: 100px;
    }

    .panel-tag-dot {
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
      animation: pulse-dot 1.6s ease-in-out infinite;
    }

    .parcel-counter {
      font-size: 11px;
      color: var(--text-subtle);
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .panel-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .panel-title .num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      color: var(--brand);
      font-weight: 600;
    }

    .panel-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    .panel-subtitle strong {
      color: var(--text);
      font-weight: 600;
    }

    .panel-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-subtle);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-value {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .stat-sub {
      font-size: 11px;
      color: var(--text-subtle);
      margin-top: 2px;
    }

    /* === Track section === */
    .track-section {
      border-bottom: 1px solid var(--border);
    }

    .track-header {
      padding: 20px 24px 8px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .track-header:hover {
      background: var(--surface);
    }

    .track-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--brand-light);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .track-icon svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    .track-title-block {
      flex: 1;
    }

    .track-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .track-tagline {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .track-counter {
      font-size: 11px;
      font-weight: 600;
      color: var(--brand);
      background: var(--brand-light);
      padding: 3px 9px;
      border-radius: 100px;
      white-space: nowrap;
      margin-top: 4px;
      text-align: center;
    }

    .btn-select-all {
      font-size: 11px;
      font-weight: 600;
      color: var(--brand);
      background: var(--brand-light);
      border: none;
      padding: 4px 10px;
      border-radius: 100px;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.2s;
    }

    .btn-select-all:hover {
      background: var(--brand);
      color: white;
    }

    .track-toggle-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      color: var(--text-muted);
      transition: transform 0.3s;
    }

    .track-toggle-icon.open {
      transform: rotate(180deg);
    }

    .track-modules {
      display: none;
      padding: 0 24px 18px;
    }

    .track-modules.open {
      display: block;
    }

    .track-description {
      font-size: 12px;
      color: var(--text-muted);
      padding: 0 0 14px 52px;
      line-height: 1.5;
    }

    .module-card {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 11px;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .module-card:hover {
      border-color: var(--border-strong);
      background: var(--surface);
    }

    .module-card.selected {
      border-color: var(--brand);
      background: var(--brand-tint);
      box-shadow: 0 0 0 3px rgba(31, 142, 254, 0.08);
    }

    .module-icon-wrap {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--surface-2);
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .module-card.selected .module-icon-wrap {
      background: var(--brand);
      color: white;
    }

    .module-icon-wrap svg {
      width: 16px;
      height: 16px;
      stroke-width: 2;
    }

    .module-body {
      flex: 1;
      min-width: 0;
    }

    .module-card-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 2px;
    }

    .module-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .module-price {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--text);
    }

    .module-card.selected .module-price {
      color: var(--brand-dark);
    }

    .module-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .module-formula {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-subtle);
      margin-top: 5px;
    }

    .module-checkbox {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1.5px solid var(--border-strong);
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .module-card.selected .module-checkbox {
      background: var(--brand);
      border-color: var(--brand);
    }

    .module-checkbox svg {
      width: 10px;
      height: 10px;
      color: white;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .module-card.selected .module-checkbox svg {
      opacity: 1;
    }

    /* === Sample report inline button === */
    .sample-cta {
      margin: 14px 24px 0;

      color: var(--text-muted);
      box-shadow: var(--shadow-sm);

    /* ================== PARCEL ANIMATION ================== */
    .parcel-appear {
      animation: parcelAppear 0.5s ease-out;
    }

    @keyframes parcelAppear {
      from {
        stroke-opacity: 0;
        fill-opacity: 0;
      }

      to {
        stroke-opacity: 1;
        fill-opacity: 0.35;
      }
    }

    .error-flash-icon {
      background: transparent !important;
      border: none !important;

    .error-flash {
      width: 50px;
      height: 50px;

      background: rgba(245, 158, 11, 0.15);
      border-radius: 50%;
      transform: translate(-50%, -50%);

    @keyframes errorPulse {

        transform: translate(-50%, -50%) scale(0.5);

        opacity: 0;

      font-weight: 600;

      gap: 10px;
      align-items: center;
      flex-shrink: 0;

      font-weight: 700;

      align-items: center;

    .modal-footer {

    .modal-summary {

      margin-bottom: 16px;
      font-size: 12px;

    .modal-summary-label {
      color: var(--text-muted);

    .modal-summary-value {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;

      left: 0;

      text-align: left;

    }

    .result-item {
      padding: 12px 16px;

      font-size: 14px;
      border-bottom: 1px solid var(--surface);
      color: var(--text);
    }

    .result-item:hover {
      background: var(--brand-tint);
      color: var(--brand-dark);
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .map-search-wrap {
      position: absolute;
      top: 20px;
      left: 60px;
      z-index: 1000;
      width: 380px;
      background: var(--bg);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }

    .search-type-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .search-tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: var(--surface);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: 12px 12px 0 0;
      transition: all 0.2s;
    }

    .search-tab.active {
      background: var(--bg);
      color: var(--brand);
    }

    .search-input-box {
      padding: 10px;
      display: flex;
      gap: 8px;
      position: relative;
    }

    .search-input-box input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      font-family: 'Inter', sans-serif;

    .search-input-box input:focus {
      border-color: var(--brand);

    /* ================== RESPONSIVE ================== */
    @media (max-width: 1024px) {
      #sidebar {
        width: 400px;
      }

      #map {
        right: 400px;
      }

      .hint,
      .status-toast {
        left: calc(50% - 200px);
      }
    }

    @media (max-width: 768px) {
      header {
        padding: 10px 16px;
      }

      .header-link,
      .header-pill,
      .header-divider {
        display: none;
      }

      #sidebar {
        width: 100%;
        top: auto;
        bottom: 0;
        height: 80vh;
        border-left: none;
        border-top: 1px solid var(--border);
        border-radius: 18px 18px 0 0;
        transform: translateY(100%);
        box-shadow: 0 -8px 32px rgba(15, 23, 42, 0.15);
      }

      #sidebar.visible {
        transform: translateY(0);
      }

      #map {
        right: 0 !important;
        bottom: 0;
      }

      .hint,
      .status-toast {
        left: 50%;
        max-width: calc(100% - 32px);
      }

      .map-search-wrap {
        left: 16px;
        top: 16px;
        width: calc(100% - 32px);
      }
    }
  </style>
</head>

    // ============================================================
    // KONFIG GIS
    // ============================================================
    proj4.defs('EPSG:2180',
      '+proj=tmerc +lat_0=0 +lon_0=19 +k=0.9993 +x_0=500000 +y_0=-5300000 ' +
      '+ellps=GRS80 +units=m +no_defs');

    // ============================================================
    // GIS HELPERS
    // ============================================================
    function parseWKT(wkt) {
      wkt = wkt.replace(/^SRID=\d+;/i, '').trim();
      const isMulti = /^MULTIPOLYGON/i.test(wkt);
      const ringRegex = /\(([0-9.\s,\-]+)\)/g;
      const rings = [];
      let match;
      while ((match = ringRegex.exec(wkt)) !== null) {
        const coords = match[1].split(',').map(p => {
          const parts = p.trim().split(/\s+/).map(Number);
          return [parts[0], parts[1]];
        });
        rings.push(coords);
      }
      if (rings.length === 0) throw new Error('No coordinates in WKT');
      return isMulti
        ? { type: 'MultiPolygon', coordinates: rings.map(r => [r]) }
        : { type: 'Polygon', coordinates: rings };
    }

    function reprojectGeometry(geom) {
      const projectCoord = (c) => proj4('EPSG:2180', 'EPSG:4326', [c[0], c[1]]);
      const projectRing = (ring) => ring.map(projectCoord);
      if (geom.type === 'Polygon')
        return { type: 'Polygon', coordinates: geom.coordinates.map(projectRing) };
      if (geom.type === 'MultiPolygon')
        return { type: 'MultiPolygon', coordinates: geom.coordinates.map(p => p.map(projectRing)) };
      throw new Error('Unsupported geometry type');
    }

    function computeArea(geom) {
      const ringArea = (ring) => {
        let sum = 0;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          sum += (ring[j][0] + ring[i][0]) * (ring[j][1] - ring[i][1]);
        }
        return Math.abs(sum / 2);
      };
      if (geom.type === 'Polygon') {
        const [outer, ...holes] = geom.coordinates;
        return ringArea(outer) - holes.reduce((s, h) => s + ringArea(h), 0);
      }
      if (geom.type === 'MultiPolygon') {
        return geom.coordinates.reduce((sum, poly) => {
          const [outer, ...holes] = poly;
          return sum + ringArea(outer) - holes.reduce((s, h) => s + ringArea(h), 0);
        }, 0);
      }
      return 0;
    }

    async function fetchParcel(lng, lat) {
      if (lng < 13.5 || lng > 25.0 || lat < 48.5 || lat > 55.5)
        throw new Error('OUT_OF_POLAND');

      const [x, y] = proj4('EPSG:4326', 'EPSG:2180', [lng, lat]);
      const params = new URLSearchParams({
        request: 'GetParcelByXY',
        xy: `${x.toFixed(2)},${y.toFixed(2)},2180`,
        result: 'geom_wkt,teryt,voivodeship,county,commune,region,parcel',
      });

      const response = await fetch(`${PROXY_URL}?${params.toString()}`);
      if (!response.ok) {
        const errBody = await response.json().catch(() => ({ error: `HTTP ${response.status}` }));
        throw new Error('PROXY_ERROR: ' + errBody.error);
      }
      const raw = await response.text();
      return parseUldkResponse(raw);
    }

    async function fetchParcelById(terytId) {
      const params = new URLSearchParams({
        request: 'GetParcelById',
        id: terytId,
        result: 'geom_wkt,teryt,voivodeship,county,commune,region,parcel',
      });

      const response = await fetch(`${PROXY_URL}?${params.toString()}`);
      if (!response.ok) {
        const errBody = await response.json().catch(() => ({ error: `HTTP ${response.status}` }));
        throw new Error('PROXY_ERROR: ' + errBody.error);
      }
      const raw = await response.text();
      return parseUldkResponse(raw);
    }

    function parseUldkResponse(raw) {
      const lines = raw.trim().split('\n');
      if (lines[0].trim() !== '0') throw new Error('PARCEL_NOT_FOUND');
      if (lines.length < 2) throw new Error('MALFORMED_RESPONSE');

      const parts = lines[1].split('|');
      if (parts.length < 7) throw new Error('MALFORMED_RESPONSE');

      const [rawWkt, teryt, voivodeship, county, commune, precinct, parcelNumber] = parts;
      const geom2180 = parseWKT(rawWkt);
      const areaM2 = Math.round(computeArea(geom2180));
      const geometry = reprojectGeometry(geom2180);

      return { teryt, voivodeship, county, commune, precinct, parcelNumber, geometry, areaM2 };
    }

    // ============================================================
    // CALCULATIONS
    // ============================================================
    function calculateModulePrice(module, areaHa) {
      return module.basePrice + module.pricePerHa * areaHa;
    }

    function calculateCurrentParcelTotals() {
      if (!state.parcel || !state.catalog) return null;
      const areaHa = state.parcel.areaM2 / 10000;
      const allModules = state.catalog.tracks.flatMap(t => t.modules);
      const lineItems = allModules
        .filter(m => state.selectedModules.has(m.code))
        .map(m => ({ ...m, total: calculateModulePrice(m, areaHa) }));
      const subtotal = lineItems.reduce((s, it) => s + it.total, 0);
      const vat = subtotal * state.catalog.vatRate;
      const gross = subtotal + vat;
      return { lineItems, subtotal, vat, gross, areaHa };
    }

    function calculateCartTotals() {
      let netto = 0;
      for (const item of state.cart) {
        netto += item.lineItems.reduce((s, m) => s + m.total, 0);
      }
      const vat = netto * (state.catalog?.vatRate ?? 0.23);
      return { netto, vat, gross: netto + vat };
    }

    function formatPLN(value) {
      return value.toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

          ? p.geometry.coordinates[0][0][0][0]

        </div>
      </div>
    </div>

    <a href="raport-przykladowy.html" target="_blank" class="sample-cta">
      <div class="sample-cta-icon">${ICONS['file-text']}</div>
      <div class="sample-cta-body">
        <div class="sample-cta-title">Zobacz przykładowy raport</div>
        <div class="sample-cta-sub">21 stron · realna analiza · PDF do druku</div>
      </div>
      <div class="sample-cta-arrow">${ICONS.arrow}</div>
    </a>
  `;

      for (const track of state.catalog.tracks) {
        const selectedInTrack = track.modules.filter(m => state.selectedModules.has(m.code)).length;
        const isExpanded = state.expandedTracks.has(track.name);

        html += `
      <div class="track-section">
        <div class="track-header" onclick="toggleTrack('${track.name}')">
          <div class="track-icon">${ICONS[track.icon] || ICONS.home}</div>
          <div class="track-title-block">
            <div class="track-name">${track.name}</div>
            <div class="track-tagline">${track.tagline}</div>
            <button class="btn-select-all" onclick="selectAllInTrack('${track.name}', event)">Zaznacz wszystkie</button>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end;">
            ${selectedInTrack > 0 ? `<div class="track-counter">${selectedInTrack} ${selectedInTrack === 1 ? 'wybrany' : 'wybranych'}</div>` : ''}
            <div class="track-toggle-icon ${isExpanded ? 'open' : ''}" style="margin-top: ${selectedInTrack > 0 ? '8px' : '0'};">
              ${ICONS['chevron-down']}
            </div>
          </div>
        </div>
        <div class="track-modules ${isExpanded ? 'open' : ''}">
          <div class="track-description" style="padding-top: 0;">${track.description}</div>
          ${track.modules.map(m => renderModuleCard(m, totals.areaHa)).join('')}
        </div>
      </div>
    `;
      }

      html += renderSummary(totals);

      document.getElementById('sidebar-content').innerHTML = html;

      document.querySelectorAll('.module-card').forEach(card => {
        card.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleModule(card.dataset.code);
        });
      });
      const addBtn = document.getElementById('btn-add-to-cart');
      if (addBtn) addBtn.addEventListener('click', addCurrentToCart);
      const cancelBtn = document.getElementById('btn-cancel-current');
      if (cancelBtn) cancelBtn.addEventListener('click', cancelCurrent);
    }

    function renderWelcomeState() {
      document.getElementById('sidebar-content').innerHTML = `
    <div class="welcome">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <h1 class="welcome-title">Popatrz na działkę z góry</h1>
      <p class="welcome-text">
        Zanim kupisz, sprawdź dokładnie co jest w okolicy — szkoły, dojazdy,
        ceny, plany zagospodarowania, potencjał inwestycyjny.
      </p>
      <div class="welcome-steps">
        <div class="welcome-step">
          <span class="welcome-step-num">1</span>
          <span><strong>Kliknij na mapie</strong> — system automatycznie pobierze granice działki z GUGiK</span>
        </div>
        <div class="welcome-step">
          <span class="welcome-step-num">2</span>
          <span><strong>Wybierz moduły raportu</strong> — od jakości życia po potencjał komercyjny</span>
        </div>
        <div class="welcome-step">
          <span class="welcome-step-num">3</span>
          <span><strong>Otrzymaj raport PDF</strong> w 24h, z konkretnymi danymi i wnioskami</span>
        </div>
      </div>
      <a href="raport-przykladowy.html" target="_blank" class="welcome-cta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Zobacz przykładowy raport
      </a>
    </div>
  `;
    }

    function renderCartHintState() {
      document.getElementById('sidebar-content').innerHTML = `
    <div class="welcome">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <h1 class="welcome-title">Wybierz kolejną działkę</h1>
      <p class="welcome-text">
        Kliknij na mapie, żeby dodać następną do koszyka,
        lub przejdź do podsumowania zamówienia.
      </p>
      <button class="welcome-cta" onclick="document.getElementById('cart-btn').click()">
        ${ICONS.cart} Otwórz koszyk (${state.cart.length})
      </button>
    </div>
  `;
    }

    function renderModuleCard(module, areaHa) {
      const isSelected = state.selectedModules.has(module.code);
      const price = calculateModulePrice(module, areaHa);
      const icon = ICONS[module.icon] || ICONS['file-text'];
      const formula = module.pricePerHa > 0
        ? `${module.basePrice} zł + ${module.pricePerHa} zł/ha · ${areaHa.toFixed(2).replace('.', ',')} ha`
        : `${module.basePrice} zł · ryczałt`;

      return `
    <button class="module-card ${isSelected ? 'selected' : ''}" data-code="${module.code}">
      <div class="module-icon-wrap">${icon}</div>
      <div class="module-body">
        <div class="module-card-top">
          <div class="module-name">${module.name}</div>
          <div class="module-price">${formatPLN(price)} zł</div>
        </div>
        <div class="module-desc">${module.description}</div>
        <div class="module-formula">${formula}</div>
      </div>
      <div class="module-checkbox">${ICONS.check}</div>
    </button>
  `;
    }

    function renderSummary(totals) {
      const hasModules = totals.lineItems.length > 0;

      if (!hasModules) {
        return `
      <div class="summary-section">
        <div class="summary-header">Podsumowanie tej działki</div>
        <div class="empty-modules">
          Wybierz przynajmniej jeden moduł raportu,<br>żeby zobaczyć cenę
        </div>
        <button class="btn-primary" disabled>
          ${ICONS.plus} Dodaj działkę do koszyka
        </button>
        <button class="btn-clear" id="btn-cancel-current">Anuluj wybór działki</button>
      </div>
    `;
      }

      return `
    <div class="summary-section">
      <div class="summary-header">Podsumowanie tej działki</div>

      ${totals.lineItems.map(it => `
        <div class="summary-line">
          <span>${it.shortName}</span>
          <span class="mono">${formatPLN(it.total)} zł</span>
        </div>
      `).join('')}

      <div class="summary-divider"></div>

      <div class="summary-line muted">
        <span>Netto</span>
        <span class="mono">${formatPLN(totals.subtotal)} zł</span>
      </div>
      <div class="summary-line muted">
        <span>VAT (${(state.catalog.vatRate * 100).toFixed(0)}%)</span>
        <span class="mono">${formatPLN(totals.vat)} zł</span>
      </div>

      <div class="summary-total">
        <div>
          <div class="summary-total-label">Cena tej działki</div>
          <div class="summary-total-sub">brutto · ${totals.lineItems.length} ${totals.lineItems.length === 1 ? 'moduł' : totals.lineItems.length < 5 ? 'moduły' : 'modułów'} · raport ~24 h</div>
        </div>
        <div>
          <div class="summary-total-value">
            ${formatPLN(totals.gross)}<span class="summary-total-currency">zł</span>
          </div>
        </div>
      </div>

      <button class="btn-primary" id="btn-add-to-cart">
        ${ICONS.plus} Dodaj działkę do koszyka
      </button>
      <button class="btn-clear" id="btn-cancel-current">Anuluj wybór tej działki</button>
    </div>
  `;
    }

    function toggleModule(code) {
      if (state.selectedModules.has(code))
        state.selectedModules.delete(code);
      else
        state.selectedModules.add(code);
      renderSidebar();
    }

    function addCurrentToCart() {
      if (!state.parcel) return;
      const totals = calculateCurrentParcelTotals();
      if (!totals || totals.lineItems.length === 0) return;

      state.cart.push({
        parcel: state.parcel,
        lineItems: totals.lineItems,
        subtotal: totals.subtotal,
        vat: totals.vat,
        gross: totals.gross,
        addedAt: new Date(),
      });

      if (activeParcelLayer) {
        activeParcelLayer.setStyle(STYLE_PARCEL_IN_CART);
        cartParcelLayers.push({
          parcelId: state.parcel.teryt,
          layer: activeParcelLayer,
        });
        activeParcelLayer = null;
      }

      state.parcel = null;
      state.selectedModules.clear();

      showToast(`
    <div class="toast-icon-success">${ICONS.check}</div>
    <div>
      <div class="msg-title">Dodano do koszyka</div>
      <div class="msg-sub">Łącznie: ${state.cart.length} ${state.cart.length === 1 ? 'działka' : state.cart.length < 5 ? 'działki' : 'działek'} · kliknij kolejną na mapie</div>
    </div>
  `, 'success');
      setTimeout(() => {
        if (activeToast && activeToast.classList.contains('success')) hideToast();
      }, 3000);

      document.getElementById('hint').classList.remove('hidden');
      updateCartButton();
      renderSidebar();
    }

    function cancelCurrent() {
      if (activeParcelLayer) {
        map.removeLayer(activeParcelLayer);
        activeParcelLayer = null;
      }
      state.parcel = null;
      state.selectedModules.clear();
      if (state.cart.length === 0) {
        document.getElementById('hint').classList.remove('hidden');
      }
      renderSidebar();
    }

    function removeFromCart(index) {
      const item = state.cart[index];
      const layerEntry = cartParcelLayers.find(l => l.parcelId === item.parcel.teryt);
      if (layerEntry) {
        map.removeLayer(layerEntry.layer);
        cartParcelLayers = cartParcelLayers.filter(l => l.parcelId !== item.parcel.teryt);
      }
      state.cart.splice(index, 1);
      updateCartButton();
      renderCartModal();
      renderSidebar();
    }

    function updateCartButton() {
      const btn = document.getElementById('cart-btn');
      const badge = document.getElementById('cart-badge');
      badge.textContent = state.cart.length;
      btn.disabled = state.cart.length === 0;
    }

    function openCartModal() {
      if (state.cart.length === 0) return;
      const totals = calculateCartTotals();

      const modalHtml = `
    <div class="modal-backdrop" id="cart-modal">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-header-left">
            <div class="modal-cart-icon">${ICONS.cart}</div>
            <div>
              <div class="modal-title">Twój koszyk</div>
              <div class="modal-subtitle">${state.cart.length} ${state.cart.length === 1 ? 'działka' : state.cart.length < 5 ? 'działki' : 'działek'} · każda jako osobny raport PDF</div>
            </div>
          </div>
          <button class="modal-close" onclick="closeCartModal()">×</button>
        </div>
        <div class="modal-body" id="cart-modal-body">
          ${renderCartItems()}
        </div>
        <div class="modal-footer">
          <div class="modal-summary">
            <div class="modal-summary-label">Liczba działek</div>
            <div class="modal-summary-value">${state.cart.length}</div>
            <div class="modal-summary-label">Liczba modułów łącznie</div>
            <div class="modal-summary-value">${state.cart.reduce((s, it) => s + it.lineItems.length, 0)}</div>
            <div class="modal-summary-label">Netto</div>
            <div class="modal-summary-value">${formatPLN(totals.netto)} zł</div>
            <div class="modal-summary-label">VAT (23%)</div>
            <div class="modal-summary-value">${formatPLN(totals.vat)} zł</div>
          </div>
          <div class="modal-total-line">
            <div>
              <div class="modal-total-label">Do zapłaty</div>
            </div>
            <div class="modal-total-value">
              ${formatPLN(totals.gross)}<span class="currency">zł</span>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="closeCartModal()">Wróć do mapy</button>
            <button class="btn-primary" onclick="checkout()">
              ${ICONS.check} Przejdź do zamówienia ${ICONS.arrow}
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);

      document.getElementById('cart-modal').addEventListener('click', (e) => {
        if (e.target.id === 'cart-modal') closeCartModal();
      });
    }

    function renderCartItems() {
      return state.cart.map((item, idx) => {
        const p = item.parcel;
        const areaHa = (p.areaM2 / 10000).toFixed(2).replace('.', ',');
        return `
      <div class="cart-item">
        <div class="cart-item-header">
          <div>
            <div class="cart-item-title">
              Działka <span class="num">${p.parcelNumber}</span>
            </div>
            <div class="cart-item-meta">
              ${p.precinct}, gm. ${p.commune} · ${areaHa} ha
            </div>
          </div>
          <div class="cart-item-actions">
            <div class="cart-item-price">${formatPLN(item.gross)} zł</div>
            <button class="cart-item-remove" onclick="removeFromCart(${idx}); return false;" title="Usuń z koszyka">
              ${ICONS.trash}
            </button>
          </div>
        </div>
        <div class="cart-item-modules">
          ${item.lineItems.map(m => `
            <span class="cart-module-pill">${m.shortName}</span>
          `).join('')}
        </div>
      </div>
    `;
      }).join('');
    }

    function renderCartModal() {
      const body = document.getElementById('cart-modal-body');
      if (!body) return;
      if (state.cart.length === 0) {
        closeCartModal();
        return;
      }
      closeCartModal();
      setTimeout(openCartModal, 50);
    }

    window.closeCartModal = function () {
      const modal = document.getElementById('cart-modal');
      if (modal) modal.remove();
    };

    window.removeFromCart = removeFromCart;

    window.checkout = function () {
      const totals = calculateCartTotals();
      alert(
        `To jest demo lokalne.\n\n` +
        `W pełnej wersji (po wdrożeniu na Netlify+Supabase) tutaj otworzy się formularz:\n\n` +
        `1. Wpiszesz e-mail\n` +
        `2. Otrzymasz mail z linkiem potwierdzającym\n` +
        `3. Klikniesz link → zamówienie zostanie zarejestrowane\n` +
        `4. Otrzymasz potwierdzenie + ja dostanę powiadomienie\n\n` +
        `Łączna kwota: ${formatPLN(totals.gross)} zł brutto\n` +
        `Zamówienie: ${state.cart.length} ${state.cart.length === 1 ? 'działka' : 'działki'}\n\n` +
        `(Pełne dane zamówienia w konsoli przeglądarki — F12)`
      );
      console.log('[CHECKOUT] Zamówienie:', {
        parcelsCount: state.cart.length,
        totalGrossPln: totals.gross.toFixed(2),
        items: state.cart.map(it => ({
          parcel: it.parcel.teryt,
          parcelNumber: it.parcel.parcelNumber,
          areaM2: it.parcel.areaM2,
          modules: it.lineItems.map(m => m.code),
          gross: it.gross.toFixed(2),
        })),
      });
    };

    // ============================================================
    // TOAST
    // ============================================================
    let activeToast = null;
    function showToast(html, type = 'loading') {
      if (activeToast) activeToast.remove();
      const el = document.createElement('div');
      el.className = 'status-toast' + (type !== 'loading' ? ' ' + type : '');
      el.innerHTML = html;
      document.body.appendChild(el);
      activeToast = el;
      return el;
    }
    function hideToast() {
      if (activeToast) {
        activeToast.remove();
        activeToast = null;
      }
    }

    function showErrorFlash(latlng) {
      const icon = L.divIcon({
        className: 'error-flash-icon',
        html: '<div class="error-flash"></div>',
        iconSize: [50, 50],
      });
      const marker = L.marker(latlng, { icon, interactive: false }).addTo(map);
      setTimeout(() => marker.remove(), 1600);
    }

    // ============================================================
    // CLICK HANDLER
    // ============================================================
    map.on('click', async (e) => {
      if (isLoading) return;
      if (!state.catalog) {
        showToast(`<div class="toast-icon-warn">${ICONS.warn}</div>
      <div><div class="msg-title">Cennik się jeszcze nie załadował</div>
      <div class="msg-sub">Spróbuj za chwilę.</div></div>`, 'error');
        setTimeout(hideToast, 2000);
        return;
      }

      if (state.parcel && state.selectedModules.size > 0) {
        if (!confirm('Masz już wybraną działkę z modułami. Kliknięcie wybierze nową — bieżąca zostanie odrzucona. Kontynuować?')) {
          return;
        }
        if (activeParcelLayer) {
          map.removeLayer(activeParcelLayer);
          activeParcelLayer = null;
        }
      }

      isLoading = true;
      document.getElementById('map').classList.add('loading');
      document.getElementById('hint').classList.add('hidden');

      showToast(`
    <div class="spinner"></div>
    <div>
      <div class="msg-title">Pobieram dane działki…</div>
      <div class="msg-sub">looka.app → GUGiK ULDK</div>
    </div>
  `);

      try {
        const parcel = await fetchParcel(e.latlng.lng, e.latlng.lat);

        const alreadyInCart = state.cart.some(it => it.parcel.teryt === parcel.teryt);
        if (alreadyInCart) {
          hideToast();
          showToast(`<div class="toast-icon-warn">${ICONS.warn}</div>
        <div><div class="msg-title">Ta działka jest już w koszyku</div>
        <div class="msg-sub">Działka ${parcel.parcelNumber} została wcześniej dodana.</div></div>`, 'error');
          setTimeout(hideToast, 3500);
          return;
        }

        if (activeParcelLayer) map.removeLayer(activeParcelLayer);

        activeParcelLayer = L.geoJSON(parcel.geometry, {
          style: STYLE_PARCEL_ACTIVE,
          onEachFeature: (f, layer) => {
            layer.on('add', () => {
              if (layer._path) layer._path.classList.add('parcel-appear');
            });
          },
        }).addTo(map);

        map.flyToBounds(activeParcelLayer.getBounds(), {
          padding: [80, 80, 80, 540],
          maxZoom: 18,
          duration: 0.6,
        });

        state.parcel = parcel;
        state.selectedModules.clear();

        hideToast();
        renderSidebar();

      } catch (err) {
        let title = 'Wystąpił błąd';
        let sub = err.message;
        if (err.message === 'PARCEL_NOT_FOUND') {
          title = 'Brak działki w tym punkcie';
          sub = 'GUGiK nie znalazł działki ewidencyjnej w tym miejscu.';
        } else if (err.message === 'OUT_OF_POLAND') {
          title = 'Punkt poza granicami Polski';
          sub = 'looka działa tylko dla obszaru Polski.';
        } else if (err.message.startsWith('NETWORK_ERROR') || err.message.startsWith('PROXY_ERROR')) {
          title = 'Problem z połączeniem';
          sub = err.message;
        } else if (err.message === 'MALFORMED_RESPONSE') {
          title = 'Nieprawidłowa odpowiedź';
          sub = 'GUGiK zwrócił dane w nieoczekiwanym formacie.';
        }

        showErrorFlash(e.latlng);
        showToast(`
      <div class="toast-icon-warn">${ICONS.warn}</div>
      <div style="flex:1">
        <div class="msg-title">${title}</div>
        <div class="msg-sub">${sub}</div>
      </div>
      <button class="close-btn" onclick="this.parentElement.remove()">×</button>
    `, 'error');
        setTimeout(() => {
          if (activeToast && activeToast.classList.contains('error')) hideToast();
        }, 5000);
      } finally {
        isLoading = false;
        document.getElementById('map').classList.remove('loading');
      }
    });

    map.on('mousemove', (e) => {
      document.getElementById('coords').textContent =
        `${e.latlng.lat.toFixed(5)}°N · ${e.latlng.lng.toFixed(5)}°E`;
    });

    document.getElementById('cart-btn').addEventListener('click', openCartModal);

    // ============================================================
    // LOAD CATALOG
    // ============================================================
    async function loadCatalog() {
      try {
        const response = await fetch('/cennik.json');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        state.catalog = await response.json();
        const totalModules = state.catalog.tracks.reduce((s, t) => s + t.modules.length, 0);

        // Domyślnie rozwijamy pierwszą sekcję po załadowaniu
        if (state.catalog.tracks.length > 0) {
          state.expandedTracks.add(state.catalog.tracks[0].name);
        }

        console.log(`✓ looka.app — cennik załadowany: ${state.catalog.tracks.length} ścieżki, ${totalModules} modułów`);
      } catch (err) {
        console.error('✗ Nie udało się załadować cennika:', err);
      }
    }
    loadCatalog();

    // Pokaż sidebar od startu z welcome state
    document.getElementById('sidebar').classList.add('visible');

    console.log('%c looka.app ', 'background:#1F8EFE;color:white;padding:4px 8px;border-radius:4px;font-weight:bold');
    console.log('Popatrz na działkę z góry zanim kupisz');
  </script>

</body>

</html>
